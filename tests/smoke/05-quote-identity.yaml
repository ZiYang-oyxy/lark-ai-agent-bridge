name: 引用消息 header 极简契约(冒烟)
description: 冒烟层最小校验:引用有 sender 时,prompt 只带一行纯 open_id header
  `[用户引用了 <open_id> 的消息]`,不加 sender_type 相关后缀说明。完整三档
  sender_type 覆盖在 tests/regression/24-quote-identity.yaml,负向"header
  与括号说明都不得含解读性暗示"由 L1 单测 covers。
tags: [smoke, quote-identity]
steps:
  - input: "你在跑吗?"
    quote_text: "review subagent 已重新启动"
    quote_sender: "ou_other_bot"
    quote_sender_type: "app"
    asserts:
      - {type: any_segment_contains, text: "[用户引用了 ou_other_bot 的消息]"}
      - {type: any_segment_contains, text: "> review subagent 已重新启动"}
      - {type: no_error}
