name: 引用消息主体身份边框(冒烟)
description: 冒烟层最小校验:引用来自"别的 bot"(sender_type=app)时,prompt 必须带
  主体身份边框——header 明确"来自另一个 bot",隔离段明确"另一个 bot 的消息 / 它
  的自述与你无关"。回归 07-27 那次跨分身 quote 导致的幻觉。完整三分支覆盖在
  tests/regression/24-quote-identity.yaml。
tags: [smoke, quote-identity]
steps:
  - input: "你在跑吗?"
    quote_text: "review subagent 已重新启动"
    quote_sender: "ou_other_bot"
    quote_sender_type: "app"
    asserts:
      - {type: any_segment_contains, text: "来自另一个 bot"}
      - {type: any_segment_contains, text: "另一个 bot 的消息"}
      - {type: any_segment_contains, text: "它的自述与你无关"}
      - {type: no_error}
