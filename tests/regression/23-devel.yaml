name: /.devel 边界
description: simulate 环境已装配 DevMode store,覆盖开关成功路径 + 用法错误分支。
  锁死文案防退化,断言标志性关键词而不是完整文案(避免 markdown 措辞微调触发误报)。
tags: [regression, devel]
steps:
  # 空态查询:默认 prerelease=false,显示"已关闭"。
  - input: "/.devel"
    asserts:
      - {type: event_type, expected: "message"}
      - {type: segment_contains, text: "开发者模式"}
      - {type: segment_contains, text: "已关闭"}
      - {type: segment_contains, text: "stable"}
      - {type: no_error}

  # 开启:写入 dev-mode.json,状态变"已开启"。
  # 注意:每个测试步骤独立 workdir,故 store 每步都从头开始。此处 arg=1 从空态开启,
  # 输出"已开启";下一 step arg=0 又是新 workdir,再从空态到关闭。
  - input: "/.devel 1"
    asserts:
      - {type: event_type, expected: "message"}
      - {type: segment_contains, text: "开发者模式"}
      - {type: segment_contains, text: "已开启"}
      - {type: segment_contains, text: "预发布"}
      - {type: no_error}

  # 关闭:显式关闭,状态"已关闭"。
  - input: "/.devel 0"
    asserts:
      - {type: segment_contains, text: "已关闭"}
      - {type: no_error}

  # 非法参数:走 default 分支,返回用法提示。
  - input: "/.devel bogus"
    asserts:
      - {type: segment_contains, text: "用法"}
      - {type: segment_contains, text: "/.devel 0|1"}
