name: 引用消息 header 极简契约
description: |
  覆盖 quote 注入的极简契约：header 只有一行 `[用户引用了 <open_id> 的消息]`
  (或 sender 缺失时的 `[用户引用了一条消息]`)，然后逐行 `> ` 引文，之后一个
  空行结束。**不按 sender_type 加任何后缀说明**——"来自另一个 bot(不是你)"、
  "由你自己(本 bot)早先发出" 都是对 agent 的解读性暗示，且判定可能失真(同一
  App 但 self_bot 识别漏、或 upstream sender_type 不准)。sender_type 字段仍
  保留在 Input/audit 里，只是不再进 prompt 文本。

  历史：db033cc(rc.6)曾在引用块尾追加分级隔离预警段防跨主体幻觉；2026-08-05
  发现该预警在"用户短指令依赖引用作上下文"场景诱导 agent 主动断联引用，
  整段移除；同日进一步移除 header 后缀里"来自另一个 bot"、"由你自己发出"
  这类同为解读性暗示的注释。顺序契约(见 25-quote-instruction-first.yaml)
  已从根子上消解跨主体幻觉。

  负向"prompt 不得含任何解读性暗示"由 L1
  TestBuildBatchPromptQuoteBlockHasNoDirectiveText 与
  TestBuildBatchPromptQuoteHeaderIsSenderTypeAgnostic 覆盖；本 YAML 只承担
  正向 header + `> ` 引文契约。

  simulate 侧 fake AgentRunner 会把 BuildBatchPrompt 的输出 echo 到 result
  event 的 text segment。event 0 是 stream 头帧不含 segments，故用
  any_segment_contains 遍历全部 event。
tags: [regression, quote-identity, minimalism]
steps:
  # 分支 1：sender_type=user —— header 就是纯 open_id 引用标注。
  - input: "然后呢?"
    quote_text: "我是一只黑猫"
    quote_sender: "ou_author"
    quote_sender_type: "user"
    asserts:
      - {type: any_segment_contains, text: "[用户引用了 ou_author 的消息]"}
      - {type: any_segment_contains, text: "> 我是一只黑猫"}
      - {type: any_segment_contains, text: "然后呢"}
      - {type: no_error}

  # 分支 2：sender_type=app —— header 结构与 user 分支一致,不加"另一个 bot"后缀。
  - input: "你看下他起子代理,后台现在真的在跑吗"
    quote_text: "review subagent 已重新启动,等它完成通知,中途不打断"
    quote_sender: "ou_other_bot"
    quote_sender_type: "app"
    asserts:
      - {type: any_segment_contains, text: "[用户引用了 ou_other_bot 的消息]"}
      - {type: any_segment_contains, text: "> review subagent 已重新启动"}
      - {type: no_error}

  # 分支 3：sender_type=self_bot —— header 结构与 user 分支一致,不加"由你自己发出"后缀。
  - input: "现在还在跑吗?"
    quote_text: "review subagent 已重新启动"
    quote_sender: "ou_self"
    quote_sender_type: "self_bot"
    asserts:
      - {type: any_segment_contains, text: "[用户引用了 ou_self 的消息]"}
      - {type: any_segment_contains, text: "> review subagent 已重新启动"}
      - {type: no_error}

  # 分支 4(边界)：无 sender + 无 sender_type,通用 header + 多行引文。
  - input: "回顾一下"
    quote_text: "line1\nline2"
    asserts:
      - {type: any_segment_contains, text: "[用户引用了一条消息]"}
      - {type: any_segment_contains, text: "> line1"}
      - {type: any_segment_contains, text: "> line2"}
      - {type: no_error}
